name: Sync Minecraft Stats

on:
  schedule:
    - cron: '*/10 * * * *' # Draait elke 10 minuten
  workflow_dispatch: # Handmatige knop om te testen

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Test SFTP Connection & Download
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          mkdir -p /tmp/mc_stats
          echo "Start verbinden met $SFTP_HOST op poort 2053 als gebruiker $SFTP_USER..."
          
          # Voer scp uit met verbose mode (-v) zodat we de exacte foutmelding in de logs zien
          sshpass -p "$SFTP_PASSWORD" scp -v -o StrictHostKeyChecking=no -P 2053 "$SFTP_USER@$SFTP_HOST:plugins/Plan/cached_json/PLAYERS_V2_*" /tmp/mc_stats/

      - name: Process and Copy to cached_json
        run: |
          mkdir -p cached_json
          rm -f cached_json/*
          LATEST_FILE=$(ls -t /tmp/mc_stats/PLAYERS_V2_* 2>/dev/null | head -n 1)
          if [ -n "$LATEST_FILE" ]; then
            cp "$LATEST_FILE" cached_json/players.json
            echo "Bestand succesvol verwerkt!"
          else
            echo "Waarschuwing: Geen spelersbestand gevonden!"
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "Minecraft Server Sync"
          git config --global user.email "server@florisn.nl"
          git add cached_json/players.json
          git diff --cached --quiet || git commit -m "Automatische update van speler statistieken [skip ci]"
          git push
