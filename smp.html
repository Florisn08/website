<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft SMP | Statistieken</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(20, 27, 44, 0.85);
            --bg-input: #121826;
            --accent-orange: #f97316;
            --accent-purple: #9146ff;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-size: 1.3rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .btn-back { color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-back:hover { color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2.5rem 8% 4rem; width: 100%; }

        .stats-title { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 1.5rem; font-family: monospace; }

        .controls-bar {
            background: rgba(20, 27, 44, 0.6);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        select, input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select { cursor: pointer; min-width: 180px; max-width: 100%; }
        input { flex: 1; min-width: 220px; }
        input:focus, select:focus { border-color: var(--accent-purple); }

        .last-updated { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.8rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.2rem; }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.2rem 1rem;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .player-card:hover { transform: translateY(-3px); border-color: rgba(145, 70, 255, 0.4); }
        .player-card.leeg { opacity: 0.5; }

        .rank-badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(251, 191, 36, 0.2); color: #fbbf24;
            font-weight: 800; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.78rem;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }
        .rank-badge.zilver { background: rgba(203, 213, 225, 0.18); color: #cbd5e1; border-color: rgba(203, 213, 225, 0.4); }
        .rank-badge.brons { background: rgba(217, 119, 6, 0.2); color: #d97706; border-color: rgba(217, 119, 6, 0.4); }
        .rank-badge.overig { background: rgba(148, 163, 184, 0.12); color: var(--text-muted); border-color: var(--border-color); }

        .player-avatar { width: 64px; height: 64px; border-radius: 10px; margin: 0.4rem 0 0.6rem; image-rendering: pixelated; }
        .player-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-value { color: var(--accent-orange); font-weight: 800; font-size: 0.95rem; }
        .loading-text { text-align: center; grid-column: 1 / -1; padding: 3rem; color: var(--text-muted); }

        footer { margin-top: auto; text-align: center; padding: 2rem; background: rgba(11, 15, 25, 0.95); border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.88rem; }

        @media (max-width: 600px) {
            .container { padding: 1.5rem 5% 3rem; }
            .stats-title { font-size: 2rem; }
            select { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo"><i class="fa-solid fa-cubes" style="color: var(--accent-green);"></i> Floris <span>SMP</span></a>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Terug naar Home</a>
    </nav>

    <div class="container">
        <h1 class="stats-title">Statistieken</h1>

        <div class="controls-bar">
            <select id="cat-filter"></select>
            <select id="stat-filter"></select>
            <input type="text" id="search-input" placeholder="Zoek een speler...">
        </div>

        <div class="last-updated">Laatst bijgewerkt: <span id="current-date">--</span></div>

        <div class="stats-grid" id="players-list">
            <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Gegevens inlezen...</div>
        </div>
    </div>

    <footer><p>&copy; 2026 Floris_N Community. Alle rechten voorbehouden.</p></footer>

    <script>
        // Categorie-id -> sleutel in het stats-bestand van Minecraft + label
        const CATEGORIEEN = {
            custom:    { key: 'minecraft:custom',    label: 'Algemeen' },
            mined:     { key: 'minecraft:mined',     label: 'Gedolven' },
            crafted:   { key: 'minecraft:crafted',   label: 'Gecraft' },
            used:      { key: 'minecraft:used',      label: 'Gebruikt' },
            broken:    { key: 'minecraft:broken',    label: 'Kapotgegaan' },
            picked_up: { key: 'minecraft:picked_up', label: 'Opgepakt' },
            dropped:   { key: 'minecraft:dropped',   label: 'Weggegooid' },
            killed:    { key: 'minecraft:killed',    label: 'Mobs gedood' },
            killed_by: { key: 'minecraft:killed_by', label: 'Gedood door' }
        };
        const TOTAAL = '__totaal__';

        // Nederlandse namen voor de bekendste algemene stats (de rest wordt automatisch "mooi" gemaakt)
        const NAMEN_CUSTOM = {
            play_time: 'Speeltijd', play_one_minute: 'Speeltijd', total_world_time: 'Totale wereldtijd',
            damage_taken: 'Schade ontvangen', damage_dealt: 'Schade uitgedeeld',
            mob_kills: 'Mobs gedood', player_kills: 'Speler kills', deaths: 'Doodgegaan',
            jump: 'Sprongen', sneak_time: 'Sneak tijd', fish_caught: 'Vis gevangen',
            walk_one_cm: 'Gelopen', sprint_one_cm: 'Gesprint', swim_one_cm: 'Gezwommen',
            fly_one_cm: 'Gevlogen (elytra)', boat_one_cm: 'Per boot', horse_one_cm: 'Te paard',
            minecart_one_cm: 'Per mijnkar', aviate_one_cm: 'Gevlogen (elytra)',
            walk_on_water_one_cm: 'Over water gelopen', walk_under_water_one_cm: 'Onder water gelopen',
            fall_one_cm: 'Gevallen', climb_one_cm: 'Geklommen', crouch_one_cm: 'Gesneakt'
        };

        let spelers = [];   // [{ naam, uuid, stats }]
        const params = new URLSearchParams(location.search);
        let cat = (params.get('cat') in CATEGORIEEN) ? params.get('cat') : 'custom';
        let stat = params.get('stat') || null;

        function esc(t) {
            return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function mooi(sleutel) {
            const kort = sleutel.replace('minecraft:', '');
            if (cat === 'custom' && NAMEN_CUSTOM[kort]) return NAMEN_CUSTOM[kort];
            const t = kort.replace(/_/g, ' ');
            return t.charAt(0).toUpperCase() + t.slice(1);
        }

        function formatteer(catId, sleutel, waarde) {
            if (catId === 'custom') {
                const k = sleutel.replace('minecraft:', '');
                if (['play_time', 'play_one_minute', 'total_world_time', 'sneak_time'].includes(k) || k.startsWith('time_since')) {
                    const totMin = Math.floor(waarde / 1200);
                    const u = Math.floor(totMin / 60), m = totMin % 60;
                    return u + 'u ' + m + 'm';
                }
                if (k.endsWith('_one_cm')) {
                    return (waarde / 100000).toLocaleString('nl-NL', { maximumFractionDigits: 1 }) + ' km';
                }
            }
            return waarde.toLocaleString('nl-NL');
        }

        async function loadServerData() {
            const lijst = document.getElementById('players-list');
            try {
                const res = await fetch('data/usercache.json');
                if (!res.ok) throw new Error('usercache.json niet gevonden');
                const cache = await res.json();

                const uniek = new Map();
                cache.forEach(p => uniek.set(p.uuid, p.name));

                const resultaten = await Promise.all([...uniek].map(async ([uuid, naam]) => {
                    try {
                        const r = await fetch('data/' + uuid + '.json');
                        if (!r.ok) return null;
                        const json = await r.json();
                        return { naam, uuid, stats: json.stats || {} };
                    } catch (e) { return null; }
                }));
                spelers = resultaten.filter(Boolean);

                if (!spelers.length) {
                    lijst.innerHTML = '<div class="loading-text">Geen stats-bestanden gevonden in de map data/.</div>';
                    return;
                }

                const lm = res.headers.get('Last-Modified');
                document.getElementById('current-date').innerText = (lm ? new Date(lm) : new Date()).toLocaleString('nl-NL');

                bouwCategorieen();
                bouwStatSelect();
                renderPlayers();
            } catch (err) {
                console.error('Fout bij inlezen data:', err);
                lijst.innerHTML = '<div class="loading-text">Kon de gegevens niet laden. Controleer of data/usercache.json bestaat.</div>';
            }
        }

        function bouwCategorieen() {
            const sel = document.getElementById('cat-filter');
            sel.innerHTML = '';
            for (const [id, c] of Object.entries(CATEGORIEEN)) {
                const o = document.createElement('option');
                o.value = id;
                o.textContent = c.label;
                if (id === cat) o.selected = true;
                sel.appendChild(o);
            }
            sel.onchange = () => { cat = sel.value; stat = null; bouwStatSelect(); renderPlayers(); };
        }

        function bouwStatSelect() {
            const sel = document.getElementById('stat-filter');
            const key = CATEGORIEEN[cat].key;
            const sleutels = new Set();
            spelers.forEach(s => Object.keys(s.stats[key] || {}).forEach(k => sleutels.add(k)));

            const opties = [...sleutels].sort((a, b) => mooi(a).localeCompare(mooi(b), 'nl'));
            if (cat !== 'custom') opties.unshift(TOTAAL);

            if (!stat || !opties.includes(stat)) {
                stat = cat === 'custom'
                    ? (opties.find(o => /play_time|play_one_minute/.test(o)) || opties[0])
                    : TOTAAL;
            }

            sel.innerHTML = '';
            opties.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o;
                opt.textContent = o === TOTAAL ? 'Alles samen (totaal)' : mooi(o);
                if (o === stat) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.onchange = () => { stat = sel.value; renderPlayers(); };
        }

        function renderPlayers() {
            const zoek = document.getElementById('search-input').value.toLowerCase();
            const lijst = document.getElementById('players-list');
            const key = CATEGORIEEN[cat].key;

            // Score van alle spelers, hoogste bovenaan. Rang geldt voor de hele lijst, ook tijdens het zoeken.
            const alle = spelers.map(s => {
                const groep = s.stats[key] || {};
                const waarde = stat === TOTAAL
                    ? Object.values(groep).reduce((a, b) => a + b, 0)
                    : (groep[stat] || 0);
                return { naam: s.naam, uuid: s.uuid, waarde };
            }).sort((a, b) => b.waarde - a.waarde || a.naam.localeCompare(b.naam));
            alle.forEach((p, i) => p.rang = i + 1);

            // URL bijwerken zodat je de pagina kunt delen
            try {
                const u = new URL(location.href);
                u.searchParams.set('cat', cat);
                u.searchParams.set('stat', stat);
                history.replaceState(null, '', u);
            } catch (e) {}

            const gefilterd = alle.filter(p => p.naam.toLowerCase().includes(zoek));
            lijst.innerHTML = '';

            if (!gefilterd.length) {
                lijst.innerHTML = '<div class="loading-text">Geen spelers gevonden voor "' + esc(zoek) + '"</div>';
                return;
            }

            gefilterd.forEach(p => {
                const badgeKlasse = p.rang === 2 ? 'zilver' : p.rang === 3 ? 'brons' : p.rang > 3 ? 'overig' : '';
                const card = document.createElement('div');
                card.className = 'player-card' + (p.waarde === 0 ? ' leeg' : '');
                card.innerHTML =
                    '<div class="rank-badge ' + badgeKlasse + '">' + p.rang + '</div>' +
                    '<img class="player-avatar" src="https://mc-heads.net/avatar/' + esc(p.uuid) + '/64" alt="' + esc(p.naam) + '" loading="lazy">' +
                    '<div class="player-name">' + esc(p.naam) + '</div>' +
                    '<div class="stat-value">' + esc(formatteer(cat, stat, p.waarde)) + '</div>';
                lijst.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', renderPlayers);
        loadServerData();
    </script>
</body>
</html>
