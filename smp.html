<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floris SMP | Statistieken</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #121a2b;
            --accent-green: #22c55e;
            --accent-purple: #9146ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }

        .btn-back {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        /* Content Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 8%;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* Filter Controls */
        .controls-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 14px;
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        select, input {
            background: #090d16;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        select {
            cursor: pointer;
            min-width: 180px;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        input:focus, select:focus {
            border-color: var(--accent-purple);
        }

        /* Grid met Spelerskaarten */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.2rem;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .player-card:hover {
            transform: translateY(-3px);
            border-color: rgba(145, 70, 255, 0.4);
        }

        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.1);
            color: #fbbf24;
            font-weight: 800;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .player-avatar {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            margin: 0.5rem 0;
        }

        .player-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.3rem;
            word-break: break-all;
        }

        .stat-value {
            color: #f97316;
            font-weight: 800;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Floris <span>SMP</span></a>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Terug</a>
    </nav>

    <div class="container">
        <h1>Statistieken</h1>

        <!-- Zoekbalk & Filters -->
        <div class="controls-bar">
            <select id="stat-filter" onchange="renderPlayers()">
                <option value="playtime">Speeltijd</option>
                <option value="damage">Schade ontvangen</option>
                <option value="mobs">Mobs gedood</option>
                <option value="distance">Afstand (km)</option>
                <option value="jumps">Sprongen</option>
                <option value="kills">Speler kills</option>
            </select>
            <input type="text" id="search-input" placeholder="Zoek een speler..." oninput="renderPlayers()">
        </div>

        <!-- Grid waar spelers in laden -->
        <div class="stats-grid" id="players-list"></div>
    </div>

    <script>
        // Voorbeeld data (dit kun je later koppelen aan een API/database)
        const playersData = [
            { name: "d_elite37", playtime: "24u 13m", damage: "12,450", mobs: "1,240", distance: "142 km", jumps: "18,420", kills: 12 },
            { name: "dannyvanderveen", playtime: "23u 34m", damage: "8,900", mobs: "980", distance: "110 km", jumps: "14,200", kills: 8 },
            { name: "ginachuu", playtime: "22u 48m", damage: "5,400", mobs: "650", distance: "95 km", jumps: "11,100", kills: 3 },
            { name: "nixnie", playtime: "9u 33m", damage: "2,100", mobs: "310", distance: "42 km", jumps: "4,500", kills: 1 },
            { name: "lvckylvc_", playtime: "7u 54m", damage: "1,800", mobs: "220", distance: "35 km", jumps: "3,800", kills: 0 },
            { name: "SAND3RTJE", playtime: "7u 11m", damage: "3,200", mobs: "410", distance: "48 km", jumps: "5,200", kills: 4 }
        ];

        function renderPlayers() {
            const filterType = document.getElementById('stat-filter').value;
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const listContainer = document.getElementById('players-list');
            
            listContainer.innerHTML = '';

            const filtered = playersData.filter(p => p.name.toLowerCase().includes(searchVal));

            filtered.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                
                // MC-Heads API haalt automatisch de Minecraft skin van de speler op!
                card.innerHTML = `
                    <div class="rank-badge">${index + 1}</div>
                    <img class="player-avatar" src="https://mc-heads.net/avatar/${player.name}/64" alt="${player.name}">
                    <div class="player-name">${player.name}</div>
                    <div class="stat-value">${player[filterType]}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        renderPlayers();
    </script>
</body>
</html>
