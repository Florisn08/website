<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft SMP | Statistieken</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(20, 27, 44, 0.85);
            --bg-input: #121826;
            --accent-orange: #f97316;
            --accent-purple: #9146ff;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-size: 1.3rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .btn-back { color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-back:hover { color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2.5rem 8% 4rem; width: 100%; }

        .stats-title { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 1.5rem; font-family: monospace; }

        .controls-bar {
            background: rgba(20, 27, 44, 0.6);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        select, input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select { cursor: pointer; min-width: 180px; }
        input { flex: 1; min-width: 220px; }
        input:focus, select:focus { border-color: var(--accent-purple); }

        .last-updated { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.8rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.2rem; }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.2rem 1rem;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .player-card:hover { transform: translateY(-3px); border-color: rgba(145, 70, 255, 0.4); }

        .rank-badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(251, 191, 36, 0.2); color: #fbbf24;
            font-weight: 800; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.78rem;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .player-avatar { width: 64px; height: 64px; border-radius: 10px; margin: 0.4rem 0 0.6rem; image-rendering: pixelated; }
        .player-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-value { color: var(--accent-orange); font-weight: 800; font-size: 0.95rem; }
        .loading-text { text-align: center; grid-column: 1 / -1; padding: 3rem; color: var(--text-muted); }

        footer { margin-top: auto; text-align: center; padding: 2rem; background: rgba(11, 15, 25, 0.95); border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.88rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo"><i class="fa-solid fa-cubes" style="color: var(--accent-green);"></i> Floris <span>SMP</span></a>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Terug naar Home</a>
    </nav>

    <div class="container">
        <h1 class="stats-title">Statistieken</h1>

        <div class="controls-bar">
            <select id="stat-filter" onchange="renderPlayers()">
                <option value="playtime">Speeltijd</option>
                <option value="damage">Schade ontvangen</option>
                <option value="mobs">Mobs gedood</option>
                <option value="distance">Afstand (km)</option>
                <option value="jumps">Sprongen</option>
                <option value="sneak">Sneak tijd</option>
                <option value="fish">Vis gevangen</option>
                <option value="kills">Speler kills</option>
            </select>
            <input type="text" id="search-input" placeholder="Zoek een speler..." oninput="renderPlayers()">
        </div>

        <div class="last-updated">Laatst bijgewerkt: <span id="current-date">--</span></div>

        <div class="stats-grid" id="players-list">
            <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Gegevens inlezen...</div>
        </div>
    </div>

    <footer><p>&copy; 2026 Floris_N Community. Alle rechten voorbehouden.</p></footer>

    <script>
        let serverPlayersData = [];

        document.getElementById('current-date').innerText = new Date().toLocaleString('nl-NL');

        async function loadServerData() {
            try {
                // Haalt het automatisch gegenereerde players.json bestand op uit de map
                const res = await fetch('./cached_json/players.json');
                if (!res.ok) throw new Error("Kon JSON-bestand niet laden");
                const data = await res.json();
                
                serverPlayersData = Object.values(data).map(p => ({
                    name: p.name || p.username,
                    playtime: p.playtime_formatted || "0u 0m",
                    raw_playtime: p.playtime || 0,
                    damage: p.damage_taken || 0,
                    mobs: p.mob_kills || 0,
                    distance: p.distance_traveled ? (p.distance_traveled / 1000).toFixed(1) + " km" : "0 km",
                    jumps: p.jump_count || 0,
                    sneak: p.sneak_time_formatted || "0m",
                    fish: p.fish_caught || 0,
                    kills: p.player_kills || 0
                }));

                renderPlayers();
            } catch (err) {
                console.error("Fout bij inlezen data:", err);
                document.getElementById('players-list').innerHTML = `<div class="loading-text">Wachten op eerste synchronisatie vanuit de server...</div>`;
            }
        }

        function renderPlayers() {
            const filterType = document.getElementById('stat-filter').value;
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const listContainer = document.getElementById('players-list');

            listContainer.innerHTML = '';
            let filtered = serverPlayersData.filter(p => p.name && p.name.toLowerCase().includes(searchVal));

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="loading-text">Geen spelers gevonden voor "${searchVal}"</div>`;
                return;
            }

            filtered.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="rank-badge">${index + 1}</div>
                    <img class="player-avatar" src="https://mc-heads.net/avatar/${player.name}/64" alt="${player.name}">
                    <div class="player-name">${player.name}</div>
                    <div class="stat-value">${player[filterType] !== undefined ? player[filterType] : '-'}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        loadServerData();
    </script>
</body>
</html>
